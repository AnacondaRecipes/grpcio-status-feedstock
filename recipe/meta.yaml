{% set name = "grpcio-status" %}
{% set version = "1.74.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c58c1b24aa454e30f1fc6a7e0dbbc194c54a408143971a94b5f4e40bb5831432

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - protobuf >=6.31.1,<7.0.0
    - grpcio >={{ version }}
    - googleapis-common-protos >=1.5.5

test:
  imports:
    - grpc_status
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
  requires:
    - pip

about:
  home: https://grpc.io
  summary: Status proto mapping for gRPC
  description: |
    Reference package for GRPC Python status proto mapping.
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  doc_url: https://grpc.github.io/grpc/python/index.html
  dev_url: https://github.com/grpc/grpc/tree/master/src/python/grpcio_status

extra:
  recipe-maintainers:
    - hadim
